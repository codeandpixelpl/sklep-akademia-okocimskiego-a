<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://sklep.akademia-okocim.pl/moje-konto.html" />
  <title>Moje konto — Akademia Okocimskiego</title>
  <meta name="description" content="Panel klienta sklepu Akademii Okocimskiego — dane, zamówienia, adresy, ulubione.">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="00%20-%20Assets/fonts/fonts.css" />
  <link rel="stylesheet" href="00%20-%20Assets/css/site.css" />
  <style>
    .doc-hero { background: linear-gradient(135deg, var(--g500) 0%, var(--g900) 100%); padding: 56px 32px 40px; }
    .doc-hero-inner { max-width: 880px; margin: 0 auto; }
    .doc-hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 5vw, 52px); color: #fff; letter-spacing: 0.04em; }
    .doc-hero h1 em { font-style: normal; color: var(--gold); }
    .doc-hero p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .doc-page { max-width: 880px; margin: 40px auto 80px; padding: 0 32px; line-height: 1.75; }
    .doc-page h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text-primary); margin: 36px 0 14px; letter-spacing: 0.04em; }
    .doc-page h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--gold); margin: 24px 0 10px; letter-spacing: 0.04em; text-transform: uppercase; }
    .doc-page p { color: var(--text-secondary); margin-bottom: 14px; }
    .doc-page ul, .doc-page ol { color: var(--text-secondary); padding-left: 22px; margin-bottom: 14px; }
    .doc-page li { margin-bottom: 6px; }
    .doc-page strong { color: var(--text-primary); }
    .doc-page a { color: var(--gold); }
    .toc { background: var(--bg-card); border: 1px solid rgba(240,235,227,0.06); border-radius: 12px; padding: 24px; margin-bottom: 32px; }
    .toc h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .toc ol { padding-left: 18px; margin-bottom: 0; }
    .toc a { font-size: 14px; }
    .placeholder-note { padding: 14px 18px; background: rgba(201,168,76,0.08); border-left: 3px solid var(--gold); border-radius: 4px; color: var(--text-secondary); font-size: 13px; margin: 24px 0; }
  </style>
</head>
<body>

<div data-ao-header></div>

<div class="doc-hero">
  <div class="doc-hero-inner">
    <p>Konto</p>
    <h1>Witaj, <em id="user-name">…</em></h1>
  </div>
</div>

<style>
  .acc-layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; }
  .acc-tabs { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 120px; }
  .acc-tab { padding: 12px 16px; border-radius: var(--r); background: transparent; border: none; cursor: pointer; text-align: left; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); transition: all 0.2s; }
  .acc-tab:hover { background: var(--bg-card); color: var(--text-primary); }
  .acc-tab.active { background: var(--gold); color: var(--bg-deep); }
  .acc-tab-logout { color: #e05252; margin-top: 16px; border-top: 1px solid rgba(240,235,227,0.06); padding-top: 16px !important; border-radius: 0; }
  .acc-tab-logout:hover { background: rgba(224,82,82,0.08); color: #e05252; }
  .acc-pane { background: var(--bg-card); border: 1px solid rgba(240,235,227,0.06); border-radius: 12px; padding: 28px; }
  .acc-pane.hidden { display: none; }
  .acc-pane h2 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--text-primary); margin-bottom: 18px; letter-spacing: 0.04em; }
  .acc-form-row { margin-bottom: 14px; }
  .acc-form-row label { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
  .acc-form-row input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1.5px solid rgba(240,235,227,0.1); border-radius: var(--r); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; }
  .acc-form-row input:focus { border-color: var(--gold); }
  .acc-save-btn { padding: 12px 24px; background: var(--gold); color: var(--bg-deep); border: none; border-radius: var(--r); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .acc-save-btn:hover { background: var(--gold2); }

  .order-list { display: flex; flex-direction: column; gap: 12px; }
  .order-row { padding: 16px 20px; background: var(--surface); border: 1px solid rgba(240,235,227,0.06); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .order-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--gold); letter-spacing: 0.04em; }
  .order-meta { font-size: 13px; color: var(--text-muted); }
  .order-status { padding: 4px 10px; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .order-status.in-progress { background: rgba(201,168,76,0.15); color: var(--gold); }
  .order-status.delivered { background: rgba(61,160,95,0.15); color: var(--g300); }
  .order-status.cancelled { background: rgba(224,82,82,0.15); color: #e05252; }
  .acc-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }

  @media (max-width: 768px) {
    .acc-layout { grid-template-columns: 1fr; }
    .acc-tabs { position: static; flex-direction: row; flex-wrap: wrap; }
    .acc-tabs .acc-tab { flex: 1; text-align: center; }
    .acc-tab-logout { margin-top: 0; padding-top: 12px !important; border: none; }
  }
</style>

<main id="main" class="doc-page">

  <div class="acc-layout">
    <aside class="acc-tabs">
      <button class="acc-tab active" data-tab="orders">Zamówienia</button>
      <button class="acc-tab" data-tab="profile">Dane osobowe</button>
      <button class="acc-tab" data-tab="addresses">Adresy</button>
      <button class="acc-tab" data-tab="wishlist">Ulubione</button>
      <button class="acc-tab acc-tab-logout" id="logout-btn">Wyloguj się</button>
    </aside>

    <div>
      <!-- Zamówienia -->
      <section class="acc-pane" id="pane-orders">
        <h2>Twoje zamówienia</h2>
        <div class="order-list" id="order-list"></div>
      </section>

      <!-- Dane -->
      <section class="acc-pane hidden" id="pane-profile">
        <h2>Dane osobowe</h2>
        <form id="profile-form">
          <div class="acc-form-row">
            <label for="prof-firstName">Imię</label>
            <input type="text" id="prof-firstName" name="firstName">
          </div>
          <div class="acc-form-row">
            <label for="prof-lastName">Nazwisko</label>
            <input type="text" id="prof-lastName" name="lastName">
          </div>
          <div class="acc-form-row">
            <label for="prof-email">E-mail</label>
            <input type="email" id="prof-email" name="email" readonly>
          </div>
          <div class="acc-form-row">
            <label for="prof-phone">Telefon</label>
            <input type="tel" id="prof-phone" name="phone">
          </div>
          <button type="submit" class="acc-save-btn">Zapisz zmiany</button>
        </form>
      </section>

      <!-- Adresy -->
      <section class="acc-pane hidden" id="pane-addresses">
        <h2>Adresy dostawy</h2>
        <form id="address-form">
          <div class="acc-form-row">
            <label for="addr-line">Ulica i numer</label>
            <input type="text" id="addr-line" name="address" autocomplete="street-address">
          </div>
          <div class="acc-form-row">
            <label for="addr-zip">Kod pocztowy</label>
            <input type="text" id="addr-zip" name="zip" maxlength="6" autocomplete="postal-code">
          </div>
          <div class="acc-form-row">
            <label for="addr-city">Miasto</label>
            <input type="text" id="addr-city" name="city" autocomplete="address-level2">
          </div>
          <button type="submit" class="acc-save-btn">Zapisz adres</button>
        </form>
      </section>

      <!-- Ulubione -->
      <section class="acc-pane hidden" id="pane-wishlist">
        <h2>Ulubione produkty</h2>
        <p>Zarządzanie ulubionymi: <a href="ulubione.html" style="color:var(--gold);">Otwórz pełną listę →</a></p>
      </section>
    </div>
  </div>

</main>

<script>
  // Auth guard — przekieruj na logowanie jeśli brak ao_user
  let user = null;
  try { user = JSON.parse(localStorage.getItem('ao_user')); } catch {}
  if (!user) { location.replace('logowanie.html?redirect=moje-konto.html'); }
  else {
    document.getElementById('user-name').textContent = (user.firstName || user.email.split('@')[0]) || 'kliencie';
    document.getElementById('prof-firstName').value = user.firstName || '';
    document.getElementById('prof-lastName').value = user.lastName || '';
    document.getElementById('prof-email').value = user.email || '';
    document.getElementById('prof-phone').value = user.phone || '';

    // Adresy z localStorage
    const addr = (() => { try { return JSON.parse(localStorage.getItem('ao_user_address')) || {}; } catch { return {}; } })();
    document.getElementById('addr-line').value = addr.address || '';
    document.getElementById('addr-zip').value = addr.zip || '';
    document.getElementById('addr-city').value = addr.city || '';
  }

  // Tabs
  document.querySelectorAll('.acc-tab[data-tab]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.acc-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      document.querySelectorAll('.acc-pane').forEach(p => p.classList.add('hidden'));
      document.getElementById('pane-' + target).classList.remove('hidden');
      AO_Site.setQueryParams({ tab: target }, { replace: true });
    });
  });

  // Init z URL ?tab=
  const initialTab = AO_Site.getQueryParam('tab');
  if (initialTab) {
    const tab = document.querySelector(`.acc-tab[data-tab="${initialTab}"]`);
    if (tab) tab.click();
  }

  // Order list — z localStorage.ao_last_order + TODO(backend) /api/me/orders
  function renderOrders() {
    const list = document.getElementById('order-list');
    const orders = [];
    try {
      const last = JSON.parse(localStorage.getItem('ao_last_order'));
      if (last) orders.push(last);
    } catch {}

    if (orders.length === 0) {
      list.innerHTML = '<div class="acc-empty">Nie masz jeszcze żadnych zamówień. <a href="index.html" style="color:var(--gold);">Zacznij zakupy →</a></div>';
      return;
    }

    list.innerHTML = orders.map(o => {
      const date = new Date(o.ts || Date.now()).toLocaleDateString('pl-PL');
      return `
        <div class="order-row">
          <div>
            <div class="order-num">${AO_Site.escapeHtml(o.orderNumber || '—')}</div>
            <div class="order-meta">${date} · ${o.total != null ? o.total + ' zł' : ''}</div>
          </div>
          <span class="order-status in-progress">W realizacji</span>
        </div>`;
    }).join('');
  }
  renderOrders();

  // Profile save
  document.getElementById('profile-form').addEventListener('submit', e => {
    e.preventDefault();
    const updated = Object.assign({}, user, {
      firstName: document.getElementById('prof-firstName').value.trim(),
      lastName: document.getElementById('prof-lastName').value.trim(),
      phone: document.getElementById('prof-phone').value.trim(),
    });
    // TODO(backend): PATCH /api/me { firstName, lastName, phone }
    localStorage.setItem('ao_user', JSON.stringify(updated));
    AO_Site.toast('Zapisano dane');
  });

  // Address save
  document.getElementById('address-form').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      address: document.getElementById('addr-line').value.trim(),
      zip: document.getElementById('addr-zip').value.trim(),
      city: document.getElementById('addr-city').value.trim(),
    };
    // TODO(backend): PUT /api/me/addresses
    localStorage.setItem('ao_user_address', JSON.stringify(data));
    AO_Site.toast('Adres zapisany');
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', () => {
    if (!confirm('Wylogować się?')) return;
    // TODO(backend): POST /api/auth/logout
    localStorage.removeItem('ao_user');
    location.href = 'index.html';
  });
</script>

<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer" role="dialog" aria-label="Koszyk" aria-modal="true">
  <div class="cart-drawer-header">
    <h3>Koszyk <span id="cart-count-drawer">(0)</span></h3>
    <button class="cart-close-btn" id="cart-close" aria-label="Zamknij koszyk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="cart-items" id="cart-items"><div class="cart-empty" id="cart-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Koszyk jest pusty</div></div>
  <div class="cart-drawer-footer" id="cart-footer" style="display:none;"><div class="cart-subtotal"><span class="cart-subtotal-label">Suma</span><span class="cart-subtotal-val" id="cart-total">0 zł</span></div><p class="cart-free-ship" id="cart-ship-info"></p><a href="checkout.html" class="cart-checkout-btn">Przejdź do kasy</a></div>
</aside>

<footer data-ao-footer></footer>

<script src="00%20-%20Assets/js/products.js"></script>
<script src="00%20-%20Assets/js/cart.js"></script>
<script src="00%20-%20Assets/js/site.js"></script>
</body>
</html>
