  <style>
    .doc-hero { background: linear-gradient(135deg, var(--g500) 0%, var(--g900) 100%); padding: 56px 32px 40px; }
    .doc-hero-inner { max-width: 880px; margin: 0 auto; }
    .doc-hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 5vw, 52px); color: #fff; letter-spacing: 0.04em; }
    .doc-hero h1 em { font-style: normal; color: var(--gold); }
    .doc-hero p { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .doc-page { max-width: 880px; margin: 40px auto 80px; padding: 0 32px; line-height: 1.75; }
    .doc-page h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text-primary); margin: 36px 0 14px; letter-spacing: 0.04em; }
    .doc-page h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--gold); margin: 24px 0 10px; letter-spacing: 0.04em; text-transform: uppercase; }
    .doc-page p { color: var(--text-secondary); margin-bottom: 14px; }
    .doc-page ul, .doc-page ol { color: var(--text-secondary); padding-left: 22px; margin-bottom: 14px; }
    .doc-page li { margin-bottom: 6px; }
    .doc-page strong { color: var(--text-primary); }
    .doc-page a { color: var(--gold); }
    .toc { background: var(--bg-card); border: 1px solid rgba(240,235,227,0.06); border-radius: 12px; padding: 24px; margin-bottom: 32px; }
    .toc h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .toc ol { padding-left: 18px; margin-bottom: 0; }
    .toc a { font-size: 14px; }
    .placeholder-note { padding: 14px 18px; background: rgba(201,168,76,0.08); border-left: 3px solid var(--gold); border-radius: 4px; color: var(--text-secondary); font-size: 13px; margin: 24px 0; }
  </style>
</head>
<body>

<div data-ao-header></div>

<div class="doc-hero">
  <div class="doc-hero-inner">
    <p>Konto</p>
    <h1><em>Logowanie</em></h1>

<style>
  .auth-form-card { max-width: 480px; margin: 0 auto; background: var(--bg-card); border: 1px solid rgba(240,235,227,0.06); border-radius: 12px; padding: 32px; }
  .auth-form-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text-primary); margin-bottom: 18px; letter-spacing: 0.04em; text-align: center; }
  .auth-row { margin-bottom: 14px; }
  .auth-row label { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
  .auth-row input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1.5px solid rgba(240,235,227,0.1); border-radius: var(--r); color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .auth-row input:focus { border-color: var(--gold); }
  .auth-row input.error { border-color: #e05252; }
  .auth-row .error-msg { display: none; font-size: 12px; color: #e05252; margin-top: 4px; }
  .auth-row input.error + .error-msg { display: block; }
  .auth-row-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .auth-row-flex label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--text-secondary); margin: 0; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .auth-row-flex label input { width: auto; accent-color: var(--gold); }
  .auth-row-flex a { font-size: 13px; color: var(--gold); }
  .auth-submit { width: 100%; padding: 14px; background: var(--gold); color: var(--bg-deep); border: none; border-radius: var(--r); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .auth-submit:hover { background: var(--gold2); }
  .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-divider { text-align: center; margin: 24px 0; color: var(--text-muted); font-size: 13px; position: relative; }
  .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 35%; height: 1px; background: rgba(240,235,227,0.08); }
  .auth-divider::before { left: 0; }
  .auth-divider::after { right: 0; }
  .auth-bottom { text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 14px; }
  .auth-bottom a { color: var(--gold); }
  .auth-msg { font-size: 14px; margin-top: 12px; padding: 10px 14px; border-radius: var(--r); }
  .auth-msg.ok { background: rgba(61,160,95,0.1); color: var(--g300); }
  .auth-msg.err { background: rgba(224,82,82,0.1); color: #e05252; }
</style>

<main id="main" class="doc-page">
  <form class="auth-form-card" id="login-form" novalidate>
    <h2>Zaloguj się</h2>

    <div class="auth-row">
      <label for="login-email">Adres e-mail</label>
      <input type="email" id="login-email" name="email" required autocomplete="email">
      <span class="error-msg">Wpisz poprawny adres e-mail</span>
    </div>

    <div class="auth-row">
      <label for="login-password">Hasło</label>
      <input type="password" id="login-password" name="password" required minlength="8" autocomplete="current-password">
      <span class="error-msg">Hasło musi mieć min. 8 znaków</span>
    </div>

    <div class="auth-row-flex">
      <label><input type="checkbox" name="remember"> Zapamiętaj mnie</label>
      <a href="reset-hasla.html">Zapomniałem hasła</a>
    </div>

    <button type="submit" class="auth-submit" id="login-btn">Zaloguj się</button>
    <div class="auth-msg" id="login-msg" hidden></div>

    <div class="auth-divider">lub</div>

    <p class="auth-bottom">Nie masz konta? <a href="rejestracja.html">Załóż konto</a></p>
  </form>
</main>

<script>
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('login-email');
    const password = document.getElementById('login-password');
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('login-msg');

    const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    const okPass = password.value.length >= 8;
    email.classList.toggle('error', !okEmail);
    password.classList.toggle('error', !okPass);
    if (!okEmail || !okPass) return;

    btn.disabled = true;
    btn.textContent = 'Logowanie…';
    msg.hidden = true;

    try {
      // TODO(backend): podmień na właściwy endpoint POST /api/auth/login { email, password }
      // const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: email.value, password: password.value }) });
      // if (!res.ok) throw new Error('Invalid');
      // const data = await res.json();
      await new Promise(r => setTimeout(r, 700));
      // mock: zapisz minimalne dane usera lokalnie
      localStorage.setItem('ao_user', JSON.stringify({ email: email.value.trim(), loginAt: Date.now() }));
      msg.hidden = false;
      msg.className = 'auth-msg ok';
      msg.textContent = 'Zalogowano. Przekierowuję…';
      setTimeout(() => location.href = 'moje-konto.html', 600);
    } catch {
      msg.hidden = false;
      msg.className = 'auth-msg err';
      msg.textContent = 'Niepoprawny e-mail lub hasło.';
      btn.disabled = false;
      btn.textContent = 'Zaloguj się';
    }
  });
</script>
